<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h2>Get an Estimate for Workspace</h2>
        <div class="form_desc">
            <h1>Post Your Requirements</h1>
            <p>Please fill the form below to receive a quote for workspace.</p>
            <p>Please add all the details required.</p>
        </div>
        <form class="form">
            <div class="form_name">
                <h3>Contact details</h3>
                <p>Please fill your information so we can get in touch with you.</p>
            </div>
            <hr>
            <label class="input_row">
                <p>Name</p>
                <input name="name" type="text" placeholder="Your Name">
            </label>
            <label class="input_row">
                <p>Phone Number</p>
                <input name="name" type="number" placeholder="(123) 456 - 7890">
            </label>
            <label class="input_row">
                <p>Email</p>
                <input name="name" type="text" placeholder="Your Mail ID">
            </label>
            <label class="input_row">
                <p>Date</p>
                <input name="name" type="date" placeholder="">
            </label>
        </form>
        <button>Next</button>
    </div>
</body>

</html>
