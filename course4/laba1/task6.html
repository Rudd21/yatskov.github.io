<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        function calculateAverage(journalNum) {
            const grade1 = parseFloat(prompt("Введіть першу оцінку:"));
            const grade2 = parseFloat(prompt("Введіть другу оцінку:"));
            const grade3 = parseFloat(prompt("Введіть третю оцінку:"));

            const avg = (grade1 + grade2 + grade3) / 3;

            const newDiv = document.createElement('div');
            newDiv.id = journalNum;
            newDiv.textContent = `Середній бал (ID блоку: ${journalNum}): ${avg.toFixed(2)}`;

            document.body.appendChild(newDiv);
        }

        const journalNumber = 12;
        calculateAverage(journalNumber);
    </script>
</body>
</html>
