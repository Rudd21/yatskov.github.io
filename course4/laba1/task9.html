<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <ul id="studentsList"></ul>

    <script>
        const list = document.getElementById('studentsList');

        while (true) {
            const input = prompt("Введіть прізвище та ім'я студента (або натисніть 'Скасувати' / 'Відміна' для завершення):");
            
            if (input === null) {
                break;
            }

            if (input.trim() !== "") {
                const li = document.createElement('li');
                li.textContent = input;
                list.appendChild(li);
            }
        }
    </script>
</body>
</html>
