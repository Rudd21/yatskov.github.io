<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 3</title>
</head>
<body>

    <script>
        const userName = prompt("Введіть ім'я:");
        const num1 = parseFloat(prompt("Введіть перше число:"));
        const num2 = parseFloat(prompt("Введіть друге число:"));

        const sum = num1 + num2;

        // Використовуємо лише конкатенацію через оператор +
        console.log("Hello, " + userName + "! The sum of " + num1 + " and " + num2 + " is " + sum);
    </script>
</body>
</html>
