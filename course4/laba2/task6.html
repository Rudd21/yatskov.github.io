<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        const num = parseInt(prompt("Введіть число:"), 10);

        if (num % 2 === 0) {
            alert("Number is even");
        } else {
            alert("Number is odd");
        }
    </script>
</body>
</html>
